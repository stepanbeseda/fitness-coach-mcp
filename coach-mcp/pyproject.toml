[project]
name = "coach-mcp"
version = "0.1.0"
description = "Coach memory MCP server for a personal fitness coach (goals, constraints, plan, notes)"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "mcp==2.2.0",
    "uvicorn>=0.31.1",
    "tzdata",
]

[project.optional-dependencies]
test = ["pytest", "ruff==0.17.0", "mypy==2.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

# Static checks of the test stage (Dockerfile): `ruff check src tests`, then `mypy`.
[tool.ruff]
output-format = "concise"

[tool.ruff.lint]
# Errors only, no formatting rules: pycodestyle E4/E7, Pyflakes, flake8-bugbear, unused `# noqa`.
select = ["E4", "E7", "F", "B", "RUF100"]

[tool.mypy]
files = ["src"]
python_version = "3.13"
strict = true
