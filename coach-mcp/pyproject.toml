[project]
name = "coach-mcp"
version = "0.1.0"
description = "Coach memory MCP server for a personal fitness coach (goals, constraints, plan, notes)"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "mcp==2.2.0",
    "uvicorn>=0.31.1",
    "tzdata",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
