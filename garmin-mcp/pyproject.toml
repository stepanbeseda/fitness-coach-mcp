[project]
name = "garmin-coach-mcp"
version = "0.1.0"
description = "Curated Garmin Connect MCP server for a personal fitness coach (recovery data + structured workouts)"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "garminconnect[workout]==0.3.17",
    "mcp==2.2.0",
    "uvicorn>=0.31.1",
    "tzdata",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_coach_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
