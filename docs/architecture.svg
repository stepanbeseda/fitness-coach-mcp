        <title id="architecture-title">Fitness Coach MCP architecture</title>
        <desc id="architecture-desc">Claude clients reach a Tailscale node and an OAuth gateway, which routes to three private MCP backends that call Hevy, Garmin Connect, Telegram and Open-Meteo.</desc>
